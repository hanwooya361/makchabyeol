<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1530" />
    <meta name="description" content="버스를 기다리는 밤, 걱정 하나를 별에 맡기고 집에 가는 정류장" />
    <title>막차별</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 링크 미리보기(카카오톡·X 등). og:image는 전체 주소여야 해서 배포 주소를 빌드 때 넣는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="막차별" />
    <meta property="og:title" content="막차별 — 버스를 기다리는 밤" />
    <meta
      property="og:description"
      content="버스를 기다리는 밤, 걱정 하나를 별에 맡기고 집에 가는 정류장"
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="밤 버스 정류장과 가로등, '막차까지 ∞분' 전광판" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
