# PR과 main 푸시마다 검사한다. main에서 전부 통과해야만 배포된다:
# 프론트는 아래 deploy-frontend가 올리고, 백엔드는 Render가 "After CI Checks Pass"로 스스로 배포한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # API 주소는 빌드 때 박힌다. 저장소 Settings > Variables에 둔다(비밀값 아님)
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test --no-daemon

  deploy-frontend:
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # 검사를 통과한 바로 그 빌드를 올린다. 다시 빌드하지 않는다
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: frontend/dist
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
