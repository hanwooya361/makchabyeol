# PR과 main 푸시마다 린트·포맷·테스트·빌드를 검사한다.
# 배포는 지금 하지 않는다(로컬 개발 기간, 공개 출시 때 AWS로. docs/tech-design.md 7장).
# 아래 deploy-frontend(Cloudflare)는 대체 경로로 설정만 남겨 두고 꺼 뒀다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # API 주소는 빌드 때 박힌다. 저장소 Settings > Variables에 둔다(비밀값 아님)
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    # 테스트는 application.yml의 test 프로필 주소(localhost:5433/makchabyeol_test)를 본다. 로컬 compose와 같은 값(개발 전용)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: makchabyeol_test
          POSTGRES_USER: makchabyeol
          POSTGRES_PASSWORD: makchabyeol-dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U makchabyeol -d makchabyeol_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test --no-daemon

  deploy-frontend:
    needs: [frontend, backend]
    # 꺼 둠: Cloudflare 비밀값이 없어 실패로 표시된다. AWS 배포(T46) 때 다시 정리. 켜려면 false && 를 지운다
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # 검사를 통과한 바로 그 빌드를 올린다. 다시 빌드하지 않는다
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: frontend/dist
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
