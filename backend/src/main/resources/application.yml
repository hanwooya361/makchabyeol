spring:
  application:
    name: makchabyeol
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 주인은 Flyway 하나다. Hibernate는 엔티티와 테이블이 맞는지 확인만 한다
      ddl-auto: validate

server:
  # Render는 포트를 PORT 환경변수로 준다. 로컬은 8080 그대로
  port: ${PORT:8080}
  # Render 프록시 뒤에서 진짜 사용자 IP를 보기 위해. 안 하면 모두가 프록시 IP 하나로 보여 IP 한도를 나눠 쓴다.
  # Tomcat은 내부망 프록시가 붙인 X-Forwarded-For만 믿어서, 사용자가 헤더를 위조해도 통하지 않는다
  forward-headers-strategy: native

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

---
# 로컬 개발: 저장소 루트 docker-compose.yml의 PostgreSQL(5433). 먼저 `docker compose up -d`
# 비밀번호는 docker-compose.yml과 같은 개발 전용 값이다(운영 값 아님)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/makchabyeol
    username: makchabyeol
    password: makchabyeol-dev

---
# 테스트: 같은 컨테이너의 별도 DB(makchabyeol_test). gradle test가 이 프로필로 돈다(build.gradle)
# CI도 같은 주소로 PostgreSQL 서비스 컨테이너를 띄운다(.github/workflows/ci.yml)
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5433/makchabyeol_test
    username: makchabyeol
    password: makchabyeol-dev

---
# 배포: 운영 PostgreSQL(공개 출시 때 AWS). 접속 정보는 환경변수로만 받는다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
