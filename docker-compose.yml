# 로컬 개발용 PostgreSQL. 실행: 저장소 루트에서 `docker compose up -d`
# 이 PC의 5432는 다른 프로젝트(AIOps)가 쓰고 있어서 5433으로 연다. 이름도 전부 makchabyeol로 따로 둔다.
name: makchabyeol

services:
  db:
    image: postgres:16
    container_name: makchabyeol-postgres
    environment:
      POSTGRES_DB: makchabyeol
      POSTGRES_USER: makchabyeol
      # 개발 전용 값. 이 PC 안에서만 열리는 로컬 DB용이고, 운영 비밀번호로 절대 쓰지 않는다
      POSTGRES_PASSWORD: makchabyeol-dev
    ports:
      # 127.0.0.1에만 열어 같은 와이파이의 다른 기기에서는 접속할 수 없게
      - "127.0.0.1:5433:5432"
    volumes:
      - makchabyeol-pgdata:/var/lib/postgresql/data
      # 처음 만들 때 한 번만 실행된다: 테스트용 DB(makchabyeol_test)를 따로 만든다
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makchabyeol -d makchabyeol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  makchabyeol-pgdata:
    name: makchabyeol-pgdata
